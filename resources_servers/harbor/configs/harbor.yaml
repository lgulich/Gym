# Resources server for Harbor-format tasks. `gym eval run <folder | harbor:dataset>` generates a
# per-taskset instance that inherits from this one and fills in `tasksets` and `datasets`.
harbor_resources_server:
  resources_servers:
    harbor:
      entrypoint: app.py
      domain: other
      verified: false

      # Top-level sandbox provider block in the merged config (see nemo_gym/sandbox/providers/*/configs).
      sandbox_provider: sandbox
      sandbox_ready_timeout_s: 900
      # The loader links these to the owning environment's actual episode and cleanup budgets.
      episode_timeout_seconds: 21600
      cleanup_timeout_seconds: 180
      # Sandbox lifetime covers the full episode, final cleanup, and this slack.
      sandbox_ttl_slack_s: 900
      sandbox_provider_options: {}
      sandbox_metadata:
        benchmark: harbor
      artifacts_dir: ${results_dir}/harbor/verifier
      # Closed IDs are retained only for this many recent sessions; active locks are never evicted.
      closed_session_cache_size: 10000

      # taskset name -> {folder, tasks: {task_id: digest}}; written by the loader.
      tasksets: {}

      datasets:
        - name: example
          type: example
          license: Apache-2.0
          jsonl_fpath: resources_servers/harbor/data/example.jsonl
